<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Balance Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --green:   #3fb950;
      --red:     #f85149;
      --usdt:    #26a17b;
      --usdc:    #2775ca;
      --eth:     #627eea;
      --tron:    #ff3e3e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 17px; font-weight: 600; }

    .update-info { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Totals ── */
    .totals {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .total-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      min-width: 180px;
    }
    .total-chip .tc-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .total-chip .tc-val   { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .total-chip .tc-unit  { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
    .total-chip .tc-delta { font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .delta-pos { color: var(--green); }
    .delta-neg { color: var(--red); }
    .delta-zero{ color: var(--muted); }

    /* ── Table ── */
    .table-wrap { padding: 20px 28px 40px; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { background: var(--surface); }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th:last-child, th:nth-last-child(2) { text-align: right; }

    tbody tr { border-bottom: 1px solid #21262d; transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #1c2128; }

    td { padding: 11px 14px; vertical-align: middle; }
    td:last-child, td:nth-last-child(2) { text-align: right; }

    .td-wallet { font-weight: 500; }
    .td-addr { font-family: monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; letter-spacing: .4px; white-space: nowrap; }
    .badge-trc { background: #2a1010; color: var(--tron); border: 1px solid #5a1a1a; }
    .badge-erc { background: #101828; color: var(--eth);  border: 1px solid #1e3260; }

    .coin { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; }
    .coin-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .coin-usdt .coin-dot { background: var(--usdt); }
    .coin-usdc .coin-dot { background: var(--usdc); }
    .coin-eth  .coin-dot { background: var(--eth); }

    .val-zero { color: var(--muted); font-weight: 400; }
    .val-err  { color: var(--red);   font-size: 11px; font-weight: 400; }
    .val-pos  { color: var(--text); }

    /* delta cell */
    .d-pos  { color: var(--green); font-size: 12px; }
    .d-neg  { color: var(--red);   font-size: 12px; }
    .d-zero { color: var(--muted); font-size: 12px; }
    .d-na   { color: var(--muted); font-size: 11px; }

    .state-msg { text-align: center; padding: 80px 20px; color: var(--muted); }
    .state-msg h2 { font-size: 16px; margin-bottom: 8px; }
  </style>
</head>
<body>

<header>
  <h1>💰 Crypto Balance Tracker</h1>
  <div class="update-info">
    <span class="dot"></span>
    <span id="updateTime">загрузка...</span>
  </div>
</header>

<div class="totals" id="totals"></div>

<div class="table-wrap">
  <table id="mainTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Кошелёк</th>
        <th>Блокчейн</th>
        <th>Монета</th>
        <th>Кол-во</th>
        <th>Δ к предыдущему дню</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="6"><div class="state-msg"><h2>Загрузка...</h2></div></td></tr>
    </tbody>
  </table>
</div>

<script>
const fmt = (n, d = 2) => {
  if (n == null) return null;
  const v = Number(n);
  if (isNaN(v)) return null;
  return v.toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: d });
};

async function fetchJson(url) {
  const r = await fetch(url + "?_=" + Date.now());
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function init() {
  let dates = [];
  try { dates = (await fetchJson("data/index.json")).dates || []; } catch (_) {}

  if (!dates.length) { renderEmpty(); return; }

  const latestDate = dates[0];
  const prevDate   = dates[1] || null;

  let snap, prevSnap, walletsCfg;
  try {
    const fetches = [
      fetchJson(`data/history/${latestDate}.json`),
      fetchJson("wallets.json"),
    ];
    if (prevDate) fetches.push(fetchJson(`data/history/${prevDate}.json`));
    const res = await Promise.all(fetches);
    snap       = res[0];
    walletsCfg = res[1];
    prevSnap   = res[2] || null;
  } catch (e) { renderEmpty("Ошибка загрузки: " + e.message); return; }

  // label map
  const labelMap = {};
  for (const w of walletsCfg.wallets || []) labelMap[w.id] = w.label;

  // prev balance lookup
  const prevMap = {};
  for (const w of (prevSnap?.wallets || [])) {
    prevMap[w.id] = w;
  }

  // update time
  const d = new Date(snap.timestamp || snap.date + "T00:00:00Z");
  document.getElementById("updateTime").textContent =
    "Обновлено: " + d.toLocaleString("ru-RU", { timeZone: "UTC" }) + " UTC" +
    (prevDate ? `  |  Δ vs ${prevDate}` : "");

  // Build rows + totals
  const rows = [];
  let totUsdt = 0, totUsdc = 0, totEth = 0;
  let prevTotUsdt = 0, prevTotUsdc = 0, prevTotEth = 0;

  for (const w of snap.wallets || []) {
    const label = labelMap[w.id] || w.label || w.id;
    const prev  = prevMap[w.id];

    if (w.trc?.address) {
      const cur  = w.trc.USDT;
      const prv  = prev?.trc?.USDT ?? null;
      rows.push({ label, addr: w.trc.address, chain: "TRC20", coin: "USDT", val: cur, prev: prv });
      totUsdt     += cur  ?? 0;
      prevTotUsdt += prv  ?? 0;
    }
    if (w.erc?.address) {
      const curEth  = w.erc.ETH,  prvEth  = prev?.erc?.ETH  ?? null;
      const curUsdt = w.erc.USDT, prvUsdt = prev?.erc?.USDT ?? null;
      const curUsdc = w.erc.USDC, prvUsdc = prev?.erc?.USDC ?? null;
      rows.push({ label, addr: w.erc.address, chain: "ERC20", coin: "ETH",  val: curEth,  prev: prvEth  });
      rows.push({ label, addr: w.erc.address, chain: "ERC20", coin: "USDT", val: curUsdt, prev: prvUsdt });
      rows.push({ label, addr: w.erc.address, chain: "ERC20", coin: "USDC", val: curUsdc, prev: prvUsdc });
      totEth      += curEth  ?? 0;  prevTotEth  += prvEth  ?? 0;
      totUsdt     += curUsdt ?? 0;  prevTotUsdt += prvUsdt ?? 0;
      totUsdc     += curUsdc ?? 0;  prevTotUsdc += prvUsdc ?? 0;
    }
  }

  // Totals bar
  const chips = [
    { label: "USDT (TRC20 + ERC20)", val: totUsdt, prev: prevTotUsdt, unit: "USDT", d: 2 },
    { label: "USDC ERC20",           val: totUsdc, prev: prevTotUsdc, unit: "USDC", d: 2 },
    { label: "ETH ERC20",            val: totEth,  prev: prevTotEth,  unit: "ETH",  d: 4 },
  ];
  document.getElementById("totals").innerHTML = chips.map(c => {
    const diff = prevDate ? (c.val - c.prev) : null;
    let deltaHtml = "";
    if (diff !== null) {
      const sign = diff > 0 ? "+" : "";
      const cls  = diff > 0.001 ? "delta-pos" : diff < -0.001 ? "delta-neg" : "delta-zero";
      deltaHtml  = `<div class="tc-delta ${cls}">${sign}${fmt(diff, c.d)} ${c.unit}</div>`;
    }
    return `
      <div class="total-chip">
        <div class="tc-label">${c.label}</div>
        <div class="tc-val">${fmt(c.val, c.d)}<span class="tc-unit">${c.unit}</span></div>
        ${deltaHtml}
      </div>`;
  }).join("");

  // Table
  const coinCls = { USDT: "coin-usdt", USDC: "coin-usdc", ETH: "coin-eth" };
  const short = a => a ? a.slice(0, 8) + "…" + a.slice(-6) : "";

  document.getElementById("tbody").innerHTML = rows.map((r, i) => {
    const decimals = r.coin === "ETH" ? 6 : 2;
    const fval = r.val == null
      ? `<span class="val-err">ошибка</span>`
      : r.val === 0
        ? `<span class="val-zero">0</span>`
        : `<span class="val-pos">${fmt(r.val, decimals)}</span>`;

    // delta
    let deltaHtml = `<span class="d-na">—</span>`;
    if (prevDate && r.prev !== null && r.val !== null) {
      const diff = r.val - r.prev;
      const sign = diff > 0 ? "+" : "";
      const cls  = diff > 0.000001 ? "d-pos" : diff < -0.000001 ? "d-neg" : "d-zero";
      deltaHtml  = `<span class="${cls}">${sign}${fmt(diff, decimals)}</span>`;
    }

    return `<tr>
      <td style="color:var(--muted);width:36px">${i + 1}</td>
      <td class="td-wallet">
        <div>${escHtml(r.label)}</div>
        <div class="td-addr">${short(r.addr)}</div>
      </td>
      <td><span class="badge badge-${r.chain === "TRC20" ? "trc" : "erc"}">${r.chain}</span></td>
      <td><span class="coin ${coinCls[r.coin] || ""}"><span class="coin-dot"></span>${r.coin}</span></td>
      <td>${fval}</td>
      <td>${deltaHtml}</td>
    </tr>`;
  }).join("");
}

function renderEmpty(msg) {
  document.getElementById("tbody").innerHTML = `
    <tr><td colspan="6">
      <div class="state-msg">
        <h2>Данных пока нет</h2>
        <p>${msg || "Запустите GitHub Actions → Collect Balances → Run workflow"}</p>
      </div>
    </td></tr>`;
  document.getElementById("totals").innerHTML = "";
  document.getElementById("updateTime").textContent = "нет данных";
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

init();
</script>
</body>
</html>
